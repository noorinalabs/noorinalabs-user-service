[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "noorinalabs-user-service"
version = "0.1.0"
description = "User authentication, authorization, and profile management for NoorinALabs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    # pyasn1 is transitive via python-jose[cryptography] -> rsa/ecdsa -> pyasn1.
    # Pin a floor to pull the fix for CVE-2026-59885 / CVE-2026-59886 (HIGH — DoS
    # via crafted ASN.1), which Trivy gates the image publish on. Mirrors the
    # isnad-ingest-platform #149 remediation of the same advisory.
    "pyasn1>=0.6.4",
    "bcrypt>=4.1.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.30",  # CVE-2026-53539 (HIGH) — quadratic-time querystring parsing (ReDoS), fixed 0.0.30
    "email-validator>=2.1.0",
    # PYSEC-2026-2338 (fixed 5.1.1) and PYSEC-2026-3805 (fixed 5.1.2). Trivy
    # gates the image publish on both.
    "aiosmtplib>=5.1.2",
    "pyotp>=2.9.0",
    # PYSEC-2026-3552 — Bleichenbacher oracle in pkcs7_decrypt_*, fixed in
    # 50.0.0. Transitive via python-jose[cryptography]; Trivy gates on it.
    "cryptography>=50.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # anyio is transitive via starlette/httpx. Pin a direct floor to clear
    # CVE-2026-63374 (IDNA 2003 certificate confusion in connect_tcp/TLSStream
    # .wrap) and CVE-2026-64847 (undrained worker stderr wedges the process
    # pool), both fixed in 4.14.2.
    "anyio>=4.14.2",
    # click is transitive via uvicorn[standard]. Pin a direct floor to clear
    # PYSEC-2026-2132 (command injection in click.edit()), fixed in 8.3.3.
    "click>=8.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.0",
    "types-pyasn1>=0.6.0",
    "aiosqlite>=0.20.0",
    "neo4j>=6.1.0",
    "testcontainers>=4.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true
follow_untyped_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "aiosmtplib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyotp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
